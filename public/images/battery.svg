<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Minh hoạ điện thoại và viên pin dung lượng cao">
  <!-- Hình nền trang trí -->
  <circle cx="140" cy="90" r="80" fill="#34c759" opacity="0.10"/>
  <circle cx="540" cy="290" r="90" fill="#0071e3" opacity="0.08"/>

  <!-- Điện thoại mở nắp lưng -->
  <rect x="70" y="40" width="160" height="300" rx="30" fill="#1d1d1f"/>
  <rect x="80" y="50" width="140" height="280" rx="22" fill="#2c2c2e"/>
  <!-- Khoang pin trống (nét đứt) -->
  <rect x="100" y="110" width="100" height="180" rx="12" fill="none" stroke="#8e8e93" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="96" y="66" width="44" height="30" rx="8" fill="#3a3a3c"/>
  <circle cx="110" cy="81" r="7" fill="#1d1d1f"/>
  <circle cx="127" cy="81" r="7" fill="#1d1d1f"/>

  <!-- Mũi tên -->
  <path d="M260 190 h90" stroke="#0071e3" stroke-width="6" stroke-linecap="round"/>
  <path d="M336 172 l20 18 l-20 18" fill="none" stroke="#0071e3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Viên pin mới -->
  <g transform="translate(390 60)">
    <rect x="0" y="0" width="150" height="260" rx="18" fill="#ffffff" stroke="#1d1d1f" stroke-width="5"/>
    <rect x="12" y="62" width="126" height="186" rx="10" fill="#34c759"/>
    <rect x="12" y="12" width="126" height="40" rx="10" fill="#e8f8ec"/>
    <path d="M84 92 l-34 66 h26 l-10 56 l38 -72 h-27 z" fill="#ffffff"/>
    <!-- Cáp kết nối -->
    <path d="M150 230 h30 v-40" fill="none" stroke="#8e8e93" stroke-width="5" stroke-linecap="round"/>
    <rect x="170" y="172" width="20" height="18" rx="3" fill="#8e8e93"/>
  </g>

  <!-- Nhãn -->
  <text x="465" y="350" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1d1d1f">Pin dung lượng cao</text>
</svg>
